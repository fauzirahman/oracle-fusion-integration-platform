services:

  app:
    build:
      context: .
      target: builder

    container_name: oracle-fusion-api

    ports:
      - "3001:3000"

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run start:dev

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/oracle_fusion

    depends_on:
      - postgres

  postgres:
    image: postgres:17

    container_name: oracle-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oracle_fusion

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: