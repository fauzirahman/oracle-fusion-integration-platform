services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: oracle-fusion-api

    ports:
      - "3000:3000"

    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules

    env_file:
      - .env

    command: npm run start:dev

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17

    container_name: oracle-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oracle_fusion

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oracle_fusion"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: